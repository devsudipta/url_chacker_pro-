name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify/build
        required: true
        default: v1.2.0
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.0.0'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag.' }
          if ("v$version" -ne $env:RELEASE_TAG) { throw 'Package version does not match release tag.' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist:win -- --publish never
      - run: npm run dist:portable -- --publish never
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
      - name: Attach files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; preserve its published files.'
            exit 0
          }
          $files = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' | ForEach-Object { $_.FullName })
          $files += 'dist\SHA256SUMS.txt'
          gh release create $tag @files --draft --verify-tag --title "URL Checker Pro $tag" --notes 'See CHANGELOG.md for changes and verification. Review these Windows builds before publishing.'
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
